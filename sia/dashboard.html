<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIA DevTools</title>
<meta name="description" content="SIA DevTools: runs, datasets, evaluations and tested prompt releases for your AI app.">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,30&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SIA DevTools. Same tokens, fonts and square corners as the landing page (web/styles.css). */
@font-face { font-family: "Fraunces Fallback"; src: local("Georgia"); size-adjust: 101%; ascent-override: 95%; descent-override: 25%; }
@font-face { font-family: "Plex Sans Fallback"; src: local("Arial"); size-adjust: 102%; ascent-override: 100%; descent-override: 27%; }
@font-face { font-family: "Plex Mono Fallback"; src: local("Courier New"); size-adjust: 100%; ascent-override: 102%; descent-override: 27%; }
:root {
  color-scheme: light;
  --paper: #F7F5F0; --surface: #FFFFFF; --surface-2: #EFECE5; --ink: #16202E; --ink-2: #3A4658; --muted: #5E6978;
  --line: #E1DCD2; --accent: #187A6C; --accent-ink: #0F5C51; --accent-soft: #E2F1ED; --on-accent: #FFFFFF;
  --signal: #E39B2D; --hero-bg: #0E1B2A;
  --good: #1D6B3A; --good-bg: #E3F0E6; --bad: #A63F25; --bad-bg: #F7E5DE; --warn: #7F5310; --warn-bg: #F5EAD3;
  /* four type sizes for the whole app */
  --t-1: 34px; --t-2: 20px; --t-3: 14.5px; --t-4: 12px;
  /* text on the dark headline card (--hero-bg is dark in both themes) */
  --on-dark: #EEF1F5; --on-dark-muted: #A9B4C2;
  --backdrop: rgba(14, 27, 42, .45);
  --f-display: "Fraunces", "Fraunces Fallback", Georgia, serif;
  --f-body: "IBM Plex Sans", "Plex Sans Fallback", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", "Plex Mono Fallback", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0F1620; --surface: #16202E; --surface-2: #1C2838; --ink: #EEF1F5; --ink-2: #C3CBD6; --muted: #8C98A9;
    --line: #2A3646; --accent: #3DB3A0; --accent-ink: #8FE0D2; --accent-soft: #123A35; --on-accent: #0A131E;
    --signal: #F0B457; --hero-bg: #0A131E;
    --good: #7FD3A0; --good-bg: #14302A; --bad: #F2947D; --bad-bg: #3A211C; --warn: #F0B457; --warn-bg: #33280F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0F1620; --surface: #16202E; --surface-2: #1C2838; --ink: #EEF1F5; --ink-2: #C3CBD6; --muted: #8C98A9;
  --line: #2A3646; --accent: #3DB3A0; --accent-ink: #8FE0D2; --accent-soft: #123A35; --on-accent: #0A131E;
  --signal: #F0B457; --hero-bg: #0A131E;
  --good: #7FD3A0; --good-bg: #14302A; --bad: #F2947D; --bad-bg: #3A211C; --warn: #F0B457; --warn-bg: #33280F;
}
* { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: var(--t-3)/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
code, pre, .mono { font-family: var(--f-mono); font-size: var(--t-4); }
code { background: var(--surface-2); padding: 1px 5px; }
pre { background: var(--surface-2); padding: 12px 14px; overflow: auto; max-height: 360px; margin: 6px 0;
      white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
pre code { background: none; padding: 0; }

/* shell */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
nav { border-right: 1px solid var(--line); padding: 24px 20px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 1px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 0 24px; color: var(--ink); text-decoration: none; }
.logo { width: 28px; height: 28px; flex: none; color: var(--ink); }
.brand b { font: 600 var(--t-1)/1 var(--f-display); font-variation-settings: "opsz" 96, "SOFT" 30; letter-spacing: -.01em; }
.brand small { font: 500 var(--t-4)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
               border: 1px solid var(--line); padding: 4px 6px; margin-left: 4px; align-self: center; }
.who { font: var(--t-4)/1.4 var(--f-mono); color: var(--muted); margin: -12px 0 18px; }
nav .proj { margin: 0 0 8px; }
nav .proj select { width: 100%; }
nav .sect { font: 500 var(--t-4)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
            padding: 16px 0 8px; border-top: 1px dashed var(--line); margin-top: 10px; }
nav .proj + .sect { border-top: 0; margin-top: 0; }
nav a { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 20px; color: var(--ink-2);
        text-decoration: none; font-size: var(--t-3); }
nav a:hover { color: var(--ink); }
nav a.on { color: var(--ink); font-weight: 600; }
nav a.on::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 8px; margin-top: -4px; background: var(--accent); }
nav .foot { margin-top: auto; padding-top: 20px; color: var(--muted); font-size: var(--t-4); display: grid; gap: 12px; }
nav .foot a { display: inline; padding: 0; color: var(--muted); }
nav .foot a:hover { color: var(--ink); }
.theme { display: inline-flex; border: 1px solid var(--line); padding: 3px; gap: 2px; width: max-content; }
.theme button { font: 500 var(--t-4)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; padding: 6px 8px; border: 1px solid transparent;
                background: none; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); }
.theme button:hover { background: var(--surface); }
main { padding: 44px 48px 80px; max-width: 1240px; width: 100%; min-width: 0; }

/* type */
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.head > div { flex: 1 1 320px; }
h1 { font: 500 var(--t-1)/1.1 var(--f-display); font-variation-settings: "opsz" 96, "SOFT" 30; letter-spacing: -.02em; margin: 0 0 8px; }
h2 { font: 500 var(--t-2)/1.25 var(--f-display); font-variation-settings: "opsz" 48, "SOFT" 30; margin: 32px 0 12px; letter-spacing: -.01em; }
.label { font: 500 var(--t-4)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 0 0 12px; }
.card h2:first-child { margin-top: 0; }
.sub { color: var(--ink-2); margin: 0; max-width: 70ch; }
h1 + .sub { margin-bottom: 24px; } .head h1 + .sub { margin-bottom: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font: 500 var(--t-4)/1 var(--f-mono);
        text-transform: uppercase; letter-spacing: .1em; text-decoration: none; margin-bottom: 14px; }
.back:hover { color: var(--ink); }
.muted { color: var(--muted); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); padding: 20px 22px; margin-bottom: 16px; }
.card.flush { padding: 6px 0 4px; }
.card.flush > h2, .card.flush > p { padding: 14px 18px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px;
        border: 1px solid var(--line); background: var(--line); gap: 1px; }
.stat { background: var(--surface); padding: 18px 20px 16px; position: relative; min-width: 0; }
.stat .k { font: 500 var(--t-4)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.stat .v { font: 500 var(--t-1)/1.15 var(--f-display); font-variation-settings: "opsz" 96, "SOFT" 30; letter-spacing: -.02em;
           font-variant-numeric: tabular-nums lining-nums; margin: 10px 0 4px; overflow-wrap: anywhere; }
.stat .n { color: var(--muted); font-size: var(--t-4); overflow-wrap: anywhere; }
.stat.hero { background: var(--hero-bg); color: var(--on-dark); }
.stat.hero .k, .stat.hero .n { color: var(--on-dark-muted); }
.stat.hero .v { color: var(--on-dark); }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.card { min-width: 0; }
.split > .card { margin-bottom: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* tables */
.tbl { width: 100%; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 11px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
td + td, th + th { padding-left: 8px; }
tr:last-child td { border-bottom: 0; }
th { font: 500 var(--t-4)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { font-family: var(--f-mono); font-size: var(--t-4); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td pre { max-height: 140px; margin: 0; }

/* status labels */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px; font: 500 var(--t-4)/1.3 var(--f-mono);
        text-transform: uppercase; letter-spacing: .1em; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.blue { background: var(--accent-soft); color: var(--accent-ink); }

/* controls */
button, .btn { font: 500 var(--t-4)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; border: 1px solid var(--line);
               background: var(--surface); color: var(--ink); padding: 11px 14px; cursor: pointer; display: inline-flex;
               align-items: center; gap: 8px; text-decoration: none; transition: background .12s, border-color .12s, color .12s; }
button:hover, .btn:hover { background: var(--surface-2); border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
button.danger { color: var(--bad); }
button.danger:hover { border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 9px 11px; max-width: 100%; }
select { font-size: var(--t-3); }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
textarea { width: 100%; min-height: 80px; font-family: var(--f-mono); font-size: var(--t-4); }
label { display: block; font: 500 var(--t-4)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 16px 0 6px; }
label:has(input[type="checkbox"]) { text-transform: none; letter-spacing: 0; font: var(--t-3)/1.4 var(--f-body); color: var(--ink-2); }
label input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { flex: 0 1 auto; min-width: 0; }
.spacer { flex: 1 1 auto; }
.bar { height: 6px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.empty { color: var(--muted); padding: 24px 18px; border: 1px dashed var(--line); background: var(--surface-2); }
.empty pre { background: var(--surface); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--paper); padding: 13px 16px; max-width: 440px;
         z-index: 9; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.diff { font-family: var(--f-mono); font-size: var(--t-4); }
.diff del { background: var(--bad-bg); color: var(--bad); text-decoration: none; display: block; }
.diff ins { background: var(--good-bg); color: var(--good); text-decoration: none; display: block; }
.tree { margin-left: 14px; border-left: 1px dashed var(--muted); padding: 4px 0 4px 14px; }
.verdict { display: flex; gap: 14px; align-items: flex-start; }
.verdict b { font-weight: 600; }
.chart { width: 100%; height: 140px; display: block; }
/* loading skeleton: grey blocks in the page's shape, no shimmer (the app has no animation) */
.sk { display: block; background: var(--surface-2); }
.sk-h1 { width: 220px; height: 34px; margin-bottom: 12px; }
.sk-sub { width: min(520px, 100%); height: 14px; margin-bottom: 28px; }
.sk-row { height: 96px; margin-bottom: 16px; border: 1px solid var(--line); background: var(--surface); }
.sk-card { height: 220px; border: 1px solid var(--line); background: var(--surface); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: miter; }
.chart .ar { fill: var(--accent); fill-opacity: .08; }
.chart .gr { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.chart text { fill: var(--muted); font: 12px var(--f-mono); }  /* SVG units, scaled with the chart */
.chart circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

/* sign-in */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px;
              background: var(--paper); }
.login { width: 100%; max-width: 440px; position: relative; padding: 32px; }
.login .brand { padding-bottom: 28px; }

/* plans */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 16px; }
.plan { background: var(--surface); border: 1px solid var(--line); padding: 22px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.plan.cur { border-color: var(--accent); }
.plan .price { font: 500 var(--t-1)/1.1 var(--f-display); font-variation-settings: "opsz" 96, "SOFT" 30; letter-spacing: -.02em; }
.plan .price small { font: var(--t-4) var(--f-mono); color: var(--muted); letter-spacing: 0; }
.plan ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
.plan button { margin-top: auto; justify-content: center; }
.callout { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); padding: 13px 15px; margin-bottom: 16px; }
.callout.bad { border-color: var(--bad); background: var(--bad-bg); }
.callout.warn { border-color: var(--warn); background: var(--warn-bg); }
details > summary { cursor: pointer; font-weight: 600; }
/* dialogs (replace the browser's prompt and confirm boxes) */
.dlg { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0; width: min(480px, calc(100vw - 32px));
       max-width: none; }
.dlg::backdrop { background: var(--backdrop); }
.dlg form { padding: 28px; position: relative; }
.dlg h2 { margin: 0 0 8px; }
.dlg input, .dlg textarea { width: 100%; }
.dlg textarea { min-height: 140px; }
.dlg .dlg-acts { justify-content: flex-end; margin-top: 24px; }
button.danger-fill { background: var(--bad); border-color: var(--bad); color: var(--paper); }
button.danger-fill:hover { background: var(--bad); border-color: var(--bad); filter: brightness(1.1); }

@media (max-width: 1100px) { main { padding: 36px 28px 64px; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; padding: 16px; border-right: 0; border-bottom: 1px solid var(--line);
        flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
  .brand { padding: 0; } .who { margin: 0 0 0 auto; }
  nav .proj { margin: 4px 0 6px; width: 100%; }
  nav .sect, nav .foot { display: none; }
  nav a { padding: 6px 0 6px 16px; } nav a.brand { padding: 0; }
  main { padding: 24px 16px 48px; }
  :root { --t-1: 28px; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const S = { key: "", me: null, projects: [], pid: null };
try { S.key = sessionStorage.getItem("sia_key") || ""; S.pid = localStorage.getItem("sia_pid"); } catch (e) {}
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const j = (v) => esc(typeof v === "string" ? v : JSON.stringify(v, null, 2));
const short = (v, n = 90) => { const s = typeof v === "string" ? v : JSON.stringify(v); return esc(s && s.length > n ? s.slice(0, n) + "…" : s); };
const ago = (t) => { if (!t) return "–"; const s = Date.now() / 1000 - t; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago"; return new Date(t * 1000).toLocaleDateString(); };
const when = (t) => t ? new Date(t * 1000).toLocaleString() : "–";
const ms = (v) => v == null ? "–" : v < 1000 ? Math.round(v) + " ms" : (v / 1000).toFixed(1) + " s";
const pct = (v) => v == null ? "–" : (v * 100).toFixed(1) + "%";
const num = (v, d = 3) => v == null ? "–" : Number(v).toFixed(d);
const int = (v) => v == null ? "–" : Number(v).toLocaleString();
const VERDICT = { improved: "good", regressed: "bad", inconclusive: "warn", no_improvement: "" };
const STATUS = { success: "good", error: "bad", running: "blue", verified: "good", rejected: "bad", pending: "warn",
                 approved: "good", candidate: "blue" };
const pill = (v, cls) => `<span class="pill ${cls ?? STATUS[v] ?? VERDICT[v] ?? ""}">${esc(v)}</span>`;
const bar = (v) => `<div class="bar" title="${pct(v)}"><i style="width:${Math.max(0, Math.min(1, v || 0)) * 100}%"></i></div>`;
const P = () => `/projects/${S.pid}`;

// theme: shared with the landing page (same localStorage key)
const THEMES = [["light", "Light"], ["dark", "Dark"], ["system", "Auto"]];
const theme = () => document.documentElement.getAttribute("data-theme") || "system";
const themeSwitch = () => `<div class="theme" role="group" aria-label="Theme">${THEMES.map(([v, l]) =>
  `<button type="button" data-act="theme" data-t="${v}" aria-pressed="${theme() === v}">${l}</button>`).join("")}</div>`;
try { const t = localStorage.getItem("sia-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}

// In-page replacement for the browser prompt and confirm boxes. Resolves to the typed text (or true), or null when cancelled.
function ask({ title, body = "", input = null, multiline = false, value = "", ok = "OK", danger = false }) {
  return new Promise((resolve) => {
    const d = document.createElement("dialog"); d.className = "dlg"; d.setAttribute("aria-labelledby", "dlg-t");
    const field = input === null ? "" : `<label for="dlg-in">${esc(input)}</label>` + (multiline
      ? `<textarea id="dlg-in" name="v" autofocus>${esc(value)}</textarea>`
      : `<input id="dlg-in" name="v" value="${esc(value)}" autocomplete="off" required autofocus>`);
    d.innerHTML = `<form method="dialog"><h2 id="dlg-t">${esc(title)}</h2>${body ? `<p class="sub">${esc(body)}</p>` : ""}${field}
      <div class="row dlg-acts"><button type="button" data-close>Cancel</button>
      <button value="ok" class="${danger ? "danger-fill" : "primary"}">${esc(ok)}</button></div></form>`;
    d.addEventListener("click", (e) => { if (e.target === d || e.target.closest("[data-close]")) d.close(); });  // backdrop, Cancel
    d.addEventListener("close", () => {
      const v = d.returnValue === "ok" ? (input === null ? true : d.querySelector("[name=v]").value) : null;
      d.remove(); resolve(v);
    });
    document.body.appendChild(d); d.showModal();
  });
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

async function api(path, opts = {}) {
  const headers = {};
  if (S.key) headers.Authorization = "Bearer " + S.key;
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch("/v1" + path, { method: opts.method || (opts.body !== undefined ? "POST" : "GET"), headers,
                                        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && !opts.quiet) { logout(); throw new Error("Your key is invalid or was revoked."); }
  if (!r.ok) {
    let d = r.statusText; try { d = (await r.json()).detail; } catch (e) {}
    throw new Error(typeof d === "string" ? d : JSON.stringify(d));
  }
  if (opts.raw) return r;
  return r.status === 204 ? null : r.json();
}

async function download(path, filename) {
  const r = await api(path, { raw: true });
  const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = filename;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function chart(evals) {
  const pts = [...evals].reverse();
  if (pts.length < 2) return `<p class="muted" style="margin:0">Run two or more evaluations to see the trend.</p>`;
  const W = 640, H = 150, L = 34, R = 12, T = 12, B = 22;
  const x = (i) => L + (i * (W - L - R)) / (pts.length - 1), y = (v) => T + (1 - v) * (H - T - B);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.summary.score).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evaluation score trend">
    ${[0, 0.5, 1].map((v) => `<line class="gr" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`).join("")}
    <path class="ar" d="${line}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z"/><path class="ln" d="${line}"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.summary.score)}" r="4"><title>${esc(verLabel(p).replace(/&[^;]+;/g, ""))}: ${num(p.summary.score)} (${ago(p.created)})</title></circle>`).join("")}
  </svg>`;
}

function loadScript(src) {

}

function diff(a, b) {
  const x = (a || "").split("\n"), y = (b || "").split("\n"), m = x.length, n = y.length;
  const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let k = n - 1; k >= 0; k--) L[i][k] = x[i] === y[k] ? L[i + 1][k + 1] + 1 : Math.max(L[i + 1][k], L[i][k + 1]);
  let i = 0, k = 0, out = "";
  while (i < m && k < n) {
    if (x[i] === y[k]) { out += esc(x[i]) + "\n"; i++; k++; }
    else if (L[i + 1][k] >= L[i][k + 1]) out += `<del>- ${esc(x[i++])}</del>`; else out += `<ins>+ ${esc(y[k++])}</ins>`;
  }
  while (i < m) out += `<del>- ${esc(x[i++])}</del>`;
  while (k < n) out += `<ins>+ ${esc(y[k++])}</ins>`;
  return out;
}

async function route() {
  const [path, qs] = (location.hash.slice(2) || "overview").split("?");
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  const [view, a, b] = path.split("/").map(decodeURIComponent);
  const table = { overview: V.overview, runs: a ? V.run : V.runs, datasets: a ? V.dataset : V.datasets, evals: a ? V.eval : V.evals,
                  compare: V.compare, lab: a ? V.version : V.lab, project: V.project, usage: V.usage, billing: V.billing };
  const fn = table[view] || V.overview;
  const navKey = view === "compare" ? "evals" : (table[view] ? view : "overview");
  if (!S.pid && !["usage", "billing"].includes(view)) {
    shell(navKey, `<h1>Welcome</h1><p class="sub">Create a project to start, or call <code>SIAClient(project=...)</code> from your app.</p>
      <form class="row card" data-form="newproj"><input name="name" placeholder="my-ai-agent" required><button class="primary">Create project</button></form>`);
    return;
  }
  shell(navKey, `<div aria-busy="true"><span class="sr">Loading…</span><span class="sk sk-h1"></span><span class="sk sk-sub"></span>
    <span class="sk sk-row"></span><div class="split"><span class="sk sk-card"></span><span class="sk sk-card"></span></div></div>`);
  try { $("main").innerHTML = await fn(q, a, b); }
  catch (e) {
    $("main").innerHTML = `<div class="head"><div><h1>This page didn't load</h1><p class="sub">${esc(e.message)}</p></div></div>
      <div class="row"><button class="primary" data-act="retry">Try again</button><a class="btn" href="#/overview">Go to overview</a></div>`;
  }
}

const parse = (s) => { const t = (s || "").trim(); if (!t) return null; try { return JSON.parse(t); } catch (e) { return t; } };
const lines = (s) => (s || "").split("\n").map((x) => x.trim()).filter(Boolean);

const FORMS = {
  async login(f) {
    S.key = f.key.value.trim();
    try { S.me = await api("/me", { quiet: true }); if (S.me.scope !== "full") throw new Error("This is an ingest key; the dashboard needs a full-scope key."); }
    catch (e) { S.key = ""; return renderLogin(e.message); }
    try { sessionStorage.setItem("sia_key", S.key); } catch (e) {}
    await loadProjects(); route();
  },
  async newproj(f) { const p = await api("/projects", { body: { name: f.name.value.trim() } }); await loadProjects(); selectProject(p.id); },
  runfilter(f) { const q = new URLSearchParams(); for (const k of ["q", "status", "tag"]) if (f[k].value) q.set(k, f[k].value); location.hash = "#/runs?" + q; },
  async feedback(f) {
    await api(`${P()}/runs/${encodeURIComponent(f.dataset.run)}/feedback`, { body: { rating: +f.rating.value, correction: parse(f.correction.value),
      category: f.category.value || null, explanation: f.explanation.value || null, reviewer: "dashboard" } });
    toast("Feedback saved as pending. Review it under Datasets."); route();
  },
  async newds(f) { const d = await api(P() + "/datasets", { body: { name: f.name.value.trim() } }); location.hash = "#/datasets/" + d.id; },
  async review(f, submitter) {
    const verdict = submitter?.value || "verified";
    await api(`${P()}/feedback/${encodeURIComponent(f.dataset.fb)}/review`, { body: { status: verdict,
      dataset_id: verdict === "verified" && f.dataset.value ? f.dataset.value : null, expected_output: parse(f.expected.value),
      critical: f.critical.checked, note: f.note.value || null } });
    toast(verdict === "verified" ? "Verified." : "Rejected."); route();
  },
  async addex(f) {
    await api(`${P()}/datasets/${f.dataset.ds}/examples`, { body: { examples: [{ input: parse(f.input.value), expected_output: parse(f.expected.value), critical: f.critical.checked }] } });
    toast("Example added; the dataset has a new version."); route();
  },
  async compare(f) {
    if (f.a.value === f.b.value) return toast("Pick two different evaluations.");
    const c = await api(P() + "/comparisons", { body: { baseline_eval_id: f.a.value, candidate_eval_id: f.b.value } });
    location.hash = "#/compare/" + c.id;
  },
  async approve(f) {
    await api(`${P()}/versions/${encodeURIComponent(f.dataset.name)}/${f.dataset.v}/approve`, { body: { comparison_id: f.comparison.value || null, override_reason: f.override.value || null } });
    toast("Approved. Activate it when you are ready."); route();
  },
  async reject(f) { await api(`${P()}/versions/${encodeURIComponent(f.dataset.name)}/${f.dataset.v}/reject`, { body: { reason: f.reason.value || null } }); route(); },
  async settings(f) {
    let policy; try { policy = JSON.parse(f.policy.value); } catch (e) { return toast("Policy must be valid JSON."); }
    await api(P(), { method: "PATCH", body: { settings: { redact: lines(f.redact.value), locked_text: lines(f.locked_text.value), policy,
      retention_days: f.retention_days.value ? +f.retention_days.value : null } } });
    toast("Settings saved."); route();
  },
  async newkey(f) {
    const k = await api("/keys", { body: { name: f.name.value, scope: f.scope.value } });
    await route();
    $("#newkey").innerHTML = `<p><b>Copy this key now; it will not be shown again:</b></p><pre>${esc(k.api_key)}</pre>`;
  },
};

const ACTS = {
  async pay(d) {
    const o = await api("/billing/orders", { body: { plan: d.plan } });
    await loadScript("https://checkout.razorpay.com/v1/checkout.js");
    const rz = new window.Razorpay({
      key: o.key_id, amount: o.amount, currency: o.currency, order_id: o.order_id, name: "SIA DevTools",
      description: `${o.plan[0].toUpperCase() + o.plan.slice(1)} plan, 30 days`,
      theme: { color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#187A6C" },
      handler: async (resp) => {
        try {
          const r = await api("/billing/verify", { body: { order_id: resp.razorpay_order_id, payment_id: resp.razorpay_payment_id, signature: resp.razorpay_signature } });
          toast(r.status === "paid" ? `Payment confirmed. You're on the ${r.plan} plan.` : r.detail);
          S.me = await api("/me"); route();
        } catch (e) { toast(e.message); }
      },
      modal: { ondismiss: () => toast("Payment window closed. Nothing was charged.") },
    });
    rz.on("payment.failed", (r) => toast("Payment failed: " + (r.error && r.error.description || "unknown error")));
    rz.open();
  },
  logout() { logout(); },
  retry() { route(); },
  theme(d) {
    const root = document.documentElement;
    if (d.t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", d.t);
    try { if (d.t === "system") localStorage.removeItem("sia-theme"); else localStorage.setItem("sia-theme", d.t); } catch (e) {}
    document.querySelectorAll("[data-act=theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === d.t)));
  },
  async exportRuns() { await download(P() + "/runs/export", "runs.jsonl"); },
  async dl(d) { await download(d.path, d.file); },
  async delex(d) { if (!await ask({ title: "Delete this example?", body: "New versions of the dataset won't include it. Earlier versions keep it.", ok: "Delete", danger: true })) return; await api(`${P()}/datasets/${d.ds}/examples/${d.ex}`, { method: "DELETE" }); route(); },
  async editex(d) {
    const ds = await api(`${P()}/datasets/${d.ds}`); const ex = ds.examples.find((e) => String(e.id) === d.ex);
    const v = await ask({ title: "Edit expected output", body: "JSON or plain text. Saving creates a new dataset version.", input: "Expected output",
      multiline: true, value: typeof ex.expected_output === "string" ? ex.expected_output : JSON.stringify(ex.expected_output, null, 2), ok: "Save" });
    if (v === null) return;
    await api(`${P()}/datasets/${d.ds}/examples/${d.ex}`, { method: "PUT", body: { expected_output: parse(v) } }); toast("Saved as a new version."); route();
  },
  async activate(d) { await api(`${P()}/versions/${encodeURIComponent(d.name)}/${d.v}/activate`, { body: {} }); toast("Activated."); route(); },
  async revoke(d) { if (!await ask({ title: "Revoke this key?", body: "Apps using it stop sending data right away. This can't be undone.", ok: "Revoke key", danger: true })) return; await api(`/keys/${d.id}/revoke`, { body: {} }); route(); },
  async rotate() {
    if (!await ask({ title: "Rotate your key?", body: "The key you're signed in with stops working immediately. The new one is shown once.", ok: "Rotate key", danger: true })) return;
    const k = await api("/keys/rotate", { body: {} }); S.key = k.api_key; try { sessionStorage.setItem("sia_key", S.key); } catch (e) {}
    S.me = await api("/me"); await route(); $("#newkey").innerHTML = `<p><b>Your new key (shown once):</b></p><pre>${esc(k.api_key)}</pre>`;
  },
};

document.addEventListener("click", async (e) => {
  const go = e.target.closest("[data-go]"); if (go && !e.target.closest("a,button")) { location.hash = go.dataset.go; return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  e.preventDefault(); try { await ACTS[a.dataset.act](a.dataset); } catch (err) { toast(err.message); }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault(); try { await FORMS[f.dataset.form](f, e.submitter); } catch (err) { toast(err.message); }
});
window.addEventListener("hashchange", () => S.me && route());

(async () => {
  try { S.me = await api("/me", { quiet: true }); } catch (e) { return renderLogin(S.key ? e.message : ""); }
  if (S.me.scope !== "full") return renderLogin("This key has ingest scope; sign in with a full-scope key.");
  await loadProjects(); route();
})();
</script>
</body>
</html>
