# A starting point for running SIA behind nginx with TLS. Replace api.example.com and the certificate paths
# (for example from Let's Encrypt / certbot). Run SIA with:
#   SIA_TRUSTED_PROXIES=127.0.0.1 SIA_ALLOWED_HOSTS=api.example.com sia serve --host 127.0.0.1
# so it is reachable only through this proxy, and believes X-Forwarded-For only from it.

# Edge rate limits, shared by every SIA worker behind this proxy (SIA's own limits are per process).
limit_req_zone $binary_remote_addr zone=sia_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sia_auth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 4m;          # keep in step with SIA_MAX_BODY_BYTES
    client_body_timeout 15s;
    client_header_timeout 15s;

    location / {
        limit_req zone=sia_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replace, don't append: clients can't inject addresses
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # admin routes: tighter limit (they create organizations and change plans)
    location ~ ^/v1/(tenants|admin/) {
        limit_req zone=sia_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # managed agents call a model synchronously; study/improve can take minutes
    location /v1/agents/ {
        limit_req zone=sia_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
