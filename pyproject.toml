[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-devtools"
version = "0.1.0"
description = "Turn AI-agent failures into tested improvements: traces, verified feedback, versioned datasets, paired evaluations and a CI regression gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "python-dotenv>=1"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "python-dotenv>=1"]

[project.scripts]
sia = "sia_devtools.cli:main"

[tool.setuptools]
packages = ["sia", "sia_devtools"]

[tool.setuptools.package-data]
sia = ["dashboard.html"]
